name: via

# Local development environment.
# Production parity: same services/images, AWS endpoints instead of local
# emulators (see docs/architecture.md).

x-python-build: &python-build
  context: .
  dockerfile: backend/Dockerfile.python

services:
  # ------------------------------------------------------------------
  # Infrastructure emulators
  # ------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8005:8000"

  dynamodb-init:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    depends_on: [dynamodb-local]
    volumes:
      - .:/app
    working_dir: /app
    environment:
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
        uv venv /opt/venv >/dev/null 2>&1 || true &&
        uv pip install --python /opt/venv/bin/python --quiet boto3 pydantic ./backend/db &&
        /opt/venv/bin/python -m via_db.bootstrap"
    restart: "no"

  # ------------------------------------------------------------------
  # Via services
  # ------------------------------------------------------------------
  api:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-api
        MODULE_PATH: via_api.main
        PORT: "8080"
    ports:
      - "${VIA_API_PORT:-8080}:8080"
    environment:
      VIA_ENV: ${VIA_ENV:-local}
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_BUCKET: ${VIA_BUCKET:-via-videos}
      VIA_AWS_REGION: ${VIA_AWS_REGION:-us-east-1}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      VIA_S3_ENDPOINT_URL: ${VIA_S3_ENDPOINT_URL:-}
      VIA_S3_PUBLIC_ENDPOINT_URL: ${VIA_S3_PUBLIC_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      - dynamodb-local

  agent:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-agent
        MODULE_PATH: via_agent.main
        PORT: "8081"
    ports:
      - "${VIA_AGENT_PORT:-8081}:8081"
    environment:
      VIA_ENV: ${VIA_ENV:-local}
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_AWS_REGION: ${VIA_AWS_REGION:-us-east-1}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      VIA_MODEL_BACKEND: ${VIA_MODEL_BACKEND:-local}
      VIA_PEGASUS_MODEL_ID: ${VIA_PEGASUS_MODEL_ID:-}
    depends_on:
      - dynamodb-local

  worker:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-video-processing-worker
        MODULE_PATH: via_worker_video_processing.main
        PORT: "8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8082/health'')"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${VIA_WORKER_PORT:-8082}:8082"
    environment:
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      VIA_PROCESSING_HOOKS_ENABLED: ${VIA_PROCESSING_HOOKS_ENABLED:-false}
    depends_on:
      - dynamodb-local

  # ------------------------------------------------------------------
  # UI
  # ------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: frontend/ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
