[project]
name = "via-db"
version = "0.1.0"
description = "DynamoDB data model, entities, and repositories for Via"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_db"]
