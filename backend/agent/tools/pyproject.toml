[project]
name = "via-tools"
version = "0.1.0"
description = "Agent tool interfaces, metadata schema, and registry for Via"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_tools"]
