[project]
name = "via-video-processing-worker"
version = "0.1.0"
description = "Via worker that consumes video lifecycle events and drives state transitions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "via-db",
    "via-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_worker_video_processing"]

[tool.uv.sources]
via-db = { workspace = true }
via-observability = { workspace = true }
