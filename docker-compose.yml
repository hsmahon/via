name: via

# Local development environment.
# Production parity: same services/images, AWS endpoints instead of local
# emulators (see docs/architecture.md).

x-python-build: &python-build
  context: .
  dockerfile: services/Dockerfile.python

services:
  # ------------------------------------------------------------------
  # Infrastructure emulators
  # ------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8005:8000"

  dynamodb-init:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    depends_on: [dynamodb-local]
    volumes:
      - .:/app
    working_dir: /app
    environment:
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
        uv venv /opt/venv >/dev/null 2>&1 || true &&
        uv pip install --python /opt/venv/bin/python --quiet boto3 pydantic ./packages/db &&
        /opt/venv/bin/python -m via_db.bootstrap"
    restart: "no"

  minio:
    image: minio/minio:latest
    depends_on:
      worker:
        condition: service_healthy
    command: server /data --console-address ":9001"
    ports:
      - "${VIA_MINIO_PORT:-9000}:9000"
      - "${VIA_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Webhook target fires on every object PUT → worker event receiver.
      MINIO_NOTIFY_WEBHOOK_ENABLE_primary: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_primary: http://worker:8082/events/minio
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR: /data/notify-queue
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT: "10000"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
      - worker
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done &&
        mc mb --ignore-existing local/${VIA_BUCKET:-via-videos} &&
        (mc event remove --force local/${VIA_BUCKET:-via-videos} 2>/dev/null || true) &&
        mc event add local/${VIA_BUCKET:-via-videos} arn:minio:sqs::primary:webhook --event put &&
        echo 'MinIO bucket + webhook configured'"
    restart: "no"

  # ------------------------------------------------------------------
  # Via services
  # ------------------------------------------------------------------
  api:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-api
        MODULE_PATH: via_api.main
        PORT: "8080"
    ports:
      - "${VIA_API_PORT:-8080}:8080"
    environment:
      VIA_ENV: ${VIA_ENV:-local}
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_BUCKET: ${VIA_BUCKET:-via-videos}
      VIA_AWS_REGION: ${VIA_AWS_REGION:-us-east-1}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      VIA_S3_ENDPOINT_URL: http://minio:9000
      VIA_S3_PUBLIC_ENDPOINT_URL: ${VIA_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      # Presigned URLs must carry credentials MinIO accepts.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      - dynamodb-local
      - minio

  agent:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-agent
        MODULE_PATH: via_agent.main
        PORT: "8081"
    ports:
      - "${VIA_AGENT_PORT:-8081}:8081"
    environment:
      VIA_ENV: ${VIA_ENV:-local}
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_AWS_REGION: ${VIA_AWS_REGION:-us-east-1}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      VIA_MODEL_BACKEND: ${VIA_MODEL_BACKEND:-local}
      VIA_PEGASUS_MODEL_ID: ${VIA_PEGASUS_MODEL_ID:-}
    depends_on:
      - dynamodb-local

  worker:
    build:
      <<: *python-build
      args:
        PACKAGE_NAME: via-video-processing-worker
        MODULE_PATH: via_worker_video_processing.main
        PORT: "8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8082/health'')"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${VIA_WORKER_PORT:-8082}:8082"
    environment:
      VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
      VIA_TABLE_NAME: ${VIA_TABLE_NAME:-via}
      VIA_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      VIA_PROCESSING_HOOKS_ENABLED: ${VIA_PROCESSING_HOOKS_ENABLED:-false}
    depends_on:
      - dynamodb-local

  # ------------------------------------------------------------------
  # UI
  # ------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
