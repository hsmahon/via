[project]
name = "via-observability"
version = "0.1.0"
description = "Structured logging and request tracing for Via services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_observability"]
