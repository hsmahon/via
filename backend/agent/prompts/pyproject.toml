[project]
name = "via-prompts"
version = "0.1.0"
description = "Versioned prompt registry and rendering for Via agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_prompts"]

[tool.hatch.build.targets.wheel.force-include]
"src/via_prompts/prompts" = "via_prompts/prompts"
