[project]
name = "via-agent"
version = "0.1.0"
description = "Via conversational video-understanding agent service (thin wrapper over the Via harness)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "via-harness",
    "via-tools",
    "via-prompts",
    "via-db",
    "via-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_agent"]

[tool.uv.sources]
via-harness = { workspace = true }
via-tools = { workspace = true }
via-prompts = { workspace = true }
via-db = { workspace = true }
via-observability = { workspace = true }
