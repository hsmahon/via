[project]
name = "via"
version = "0.1.0"
description = "Via - Video Intelligence Agent (monorepo root; workspace and tooling configuration)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend/db", "backend/api", "backend/agent/*", "backend/workers/*"]

[dependency-groups]
dev = [
    "moto>=5.0.28",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "interrogate>=1.7.0",
    "pytest-asyncio>=0.25.0",
    "boto3-stubs[dynamodb,s3,bedrock-runtime]>=1.35.0",
    "types-PyYAML>=6.0.12",
]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting for all Python packages/services
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires call expressions in defaults.
"backend/agent/service/src/via_agent/main.py" = ["B008"]
"backend/workers/video-processing-worker/src/via_worker_video_processing/main.py" = ["B008"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle errors
    "F",                # pyflakes
    "W",                # warnings
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "C4",               # flake8-comprehensions
    "SIM",              # flake8-simplify
    "RUF",              # ruff-specific
    "D",                # pydocstyle - docstrings are REQUIRED in Via
]
ignore = [
    "D105",  # magic method docstrings add no value
    "D107",  # __init__ docstrings duplicate the class docstring
    "SIM117", # nested with is common in moto/boto3 tests
    "N818",  # domain exception names read better without an Error suffix (VideoNotFound)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ['\.venv', "node_modules", "build", 'conftest\.py']

[[tool.mypy.overrides]]
module = ["moto.*"]
ignore_missing_imports = true

# Test modules use fixtures/loose fakes; keep core checks but allow
# fixture-driven pragmatism (documented in docs/local-development.md).
[[tool.mypy.overrides]]
module = [
    "backend.*.tests", "backend.*.tests.*",
]
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["no-any-return", "arg-type", "assignment", "union-attr", "attr-defined", "index"]

# ---------------------------------------------------------------------------
# pytest (run from repo root; covers every package/service)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend", "tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
    "docstring: meta-tests that enforce docstring presence/validity across the codebase",
]
asyncio_mode = "auto"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# interrogate: docstring coverage gate used in CI
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-nested-functions = true
omit-covered = false
verbose = 1

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend"]
